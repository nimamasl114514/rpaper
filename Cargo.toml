[package]
name = "rpaper"
version = "0.2.0"
edition = "2021"
description = "Rpaper - GPU-accelerated dynamic wallpaper engine for Windows"

[build-dependencies]
# 编译时嵌入 manifest — 启用 comctl32 v6 visual styles + PerMonitorV2 DPI 感知
embed-manifest = "1.0"
# 编译时嵌入 Windows 资源（图标、版本信息）— 调用 Windows SDK rc.exe
embed-resource = "2.5"
# Slint UI 编译器
slint-build = "1.8"

[dependencies]
wgpu = "22"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_Media_Audio",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_Graphics_Dwm",
] }
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
rodio = "0.19"
# LZ4 解压 — Wallpaper Engine .pkg 用 LZ4 块压缩
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
# H.264 解码 — Cisco OpenH264，全 Profile 支持 (CABAC+B帧+子分区)
openh264 = { version = "0.7", default-features = false, features = ["source"] }
# Slint UI 框架 — 现代化壁纸库窗口
slint = { version = "1.8", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-2"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
